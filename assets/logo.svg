<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#07172a"/>
      <stop offset="0.72" stop-color="#020b16"/>
      <stop offset="1" stop-color="#00040a"/>
    </radialGradient>
    <linearGradient id="cyan" x1="18%" y1="5%" x2="82%" y2="95%">
      <stop offset="0" stop-color="#7df7ff"/>
      <stop offset="0.22" stop-color="#00d9ff"/>
      <stop offset="0.55" stop-color="#007bff"/>
      <stop offset="0.82" stop-color="#00cfff"/>
      <stop offset="1" stop-color="#004bff"/>
    </linearGradient>
    <linearGradient id="arc" x1="20%" y1="10%" x2="80%" y2="100%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.12" stop-color="#31f3ff"/>
      <stop offset="0.45" stop-color="#008cff"/>
      <stop offset="0.78" stop-color="#0062ff"/>
      <stop offset="1" stop-color="#18eaff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="245" fill="url(#bg)"/>

  <!-- Outer neon ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#008cff" stroke-width="24" opacity=".22" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#arc)" stroke-width="12" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="205" fill="none" stroke="#00cfff" stroke-width="3" opacity=".9"/>

  <!-- Wi-Fi arcs -->
  <path d="M151 192 Q256 91 361 192"
        fill="none" stroke="#008cff" stroke-width="64" stroke-linecap="round" opacity=".3" filter="url(#glow)"/>
  <path d="M151 192 Q256 91 361 192"
        fill="none" stroke="url(#cyan)" stroke-width="48" stroke-linecap="round"/>

  <path d="M188 251 Q256 186 324 251"
        fill="none" stroke="#008cff" stroke-width="60" stroke-linecap="round" opacity=".3" filter="url(#glow)"/>
  <path d="M188 251 Q256 186 324 251"
        fill="none" stroke="url(#cyan)" stroke-width="44" stroke-linecap="round"/>

  <path d="M220 306 Q256 270 292 306"
        fill="none" stroke="#008cff" stroke-width="56" stroke-linecap="round" opacity=".3" filter="url(#glow)"/>
  <path d="M220 306 Q256 270 292 306"
        fill="none" stroke="url(#cyan)" stroke-width="40" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="362" r="39" fill="#008cff" opacity=".35" filter="url(#glow)"/>
  <circle cx="256" cy="362" r="34" fill="url(#cyan)"/>
  <circle cx="246" cy="351" r="12" fill="#b9fbff" opacity=".7"/>
</svg>
